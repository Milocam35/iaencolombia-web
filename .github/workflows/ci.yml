name: Web validation
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      NEXT_PUBLIC_ACIA_API_URL: https://api.example.test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Block high and critical production dependency vulnerabilities
        run: npm audit --omit=dev --audit-level=high
      - run: npm test
      - run: npm run test:member-access
      - run: npm run lint
      - run: npm run build
      - name: Smoke test local Next runtime and image optimizer
        run: node scripts/next-runtime-smoke.mjs
      - run: git diff --check
